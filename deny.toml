# cargo-deny configuration for DecentDB supply-chain checks.
# Run locally with: cargo deny check

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
# Known vulnerabilities are denied by default in cargo-deny 0.20+; list any
# deliberate, reasoned exceptions here.
ignore = [
    # bincode 1.x is unmaintained with no safe upgrade path; it is only used
    # by iai-callgrind (dev-only benchmark harness), never shipped in the
    # engine, CLI, or bindings.
    { id = "RUSTSEC-2025-0141", reason = "dev-only iai-callgrind benchmark dependency; not shipped" },
    # proc-macro-error2 is unmaintained with no safe upgrade path; likewise
    # only reachable through iai-callgrind dev tooling.
    { id = "RUSTSEC-2026-0173", reason = "dev-only iai-callgrind benchmark dependency; not shipped" },
]

[licenses]
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    # Permissive data license used by the webpki-roots certificate bundles.
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
